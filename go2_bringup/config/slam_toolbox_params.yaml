# slam_params_minimal.yaml - Memory optimized for Go2

slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # Frames
    map_frame: map
    odom_frame: odom
    base_frame: base_link

    # Input laser
    scan_topic: /scan

    # Basic operation mode
    mode: localization

    map_start_at_dock: false

    
    map_file_name: "/home/unitree/taggy_ws/map_serial_folder/map_serial"


    # Map basics
    resolution: 0.05
    map_update_interval: 0.5
    transform_publish_period: 0.02

    # Scan processing
    max_laser_range: 15.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # Throttle processing
    throttle_scans: 1
    
    # Ceres solver with limited iterations
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Loop closure settings - disabled to reduce memory
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Stack size limiting
    stack_size_to_use: 40000000
